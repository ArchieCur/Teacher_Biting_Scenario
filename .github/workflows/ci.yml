# Checks on every push and pull request. Free for public repositories.
# The banned-strings list comes from the encrypted repository secret
# BANNED_STRINGS (Settings > Secrets and variables > Actions). GitHub hides
# secret values in logs, and the check reports only file and line.

name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint (content, graph, language, contrast, built output, public safety)
        run: npm run lint
        env:
          BANNED_STRINGS: ${{ secrets.BANNED_STRINGS }}

      - name: Unit tests
        run: npm test

      - name: docs/ matches a fresh build
        run: npm run fresh

      - name: Install browser for tests
        run: npx playwright install --with-deps chromium

      - name: Browser tests (accessibility, keyboard, storage, file://, Storyline harness)
        run: npm run test:browser

      - name: Keep the browser test report if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
