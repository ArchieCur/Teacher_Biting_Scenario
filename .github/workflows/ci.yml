# Checks on every push and pull request. Free for public repositories.
# The banned-strings list comes from the encrypted repository secret
# BANNED_STRINGS (Settings > Secrets and variables > Actions). GitHub hides
# secret values in logs, and the check reports only file and line.

name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Tell GitHub to hide every banned-strings entry (as written, lower case
      # and upper case) anywhere in this run's logs, in case any later step
      # quotes text that contains one. GitHub never prints these commands.
      - name: Hide banned strings in logs
        env:
          BANNED_STRINGS: ${{ secrets.BANNED_STRINGS }}
        run: |
          printf '%s\n' "$BANNED_STRINGS" | while IFS= read -r line; do
            line="$(printf '%s' "$line" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            case "$line" in ''|'#'*) continue ;; esac
            echo "::add-mask::$line"
            echo "::add-mask::$(printf '%s' "$line" | tr '[:upper:]' '[:lower:]')"
            echo "::add-mask::$(printf '%s' "$line" | tr '[:lower:]' '[:upper:]')"
          done

      - name: Install
        run: npm ci

      - name: Lint (content, graph, language, contrast, built output, public safety)
        run: npm run lint
        env:
          BANNED_STRINGS: ${{ secrets.BANNED_STRINGS }}

      - name: Unit tests
        run: npm test

      - name: docs/ matches a fresh build
        run: npm run fresh

      - name: Install browser for tests
        run: npx playwright install --with-deps chromium

      - name: Browser tests (accessibility, keyboard, storage, file://, Storyline harness)
        run: npm run test:browser

      - name: Keep the browser test report if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
